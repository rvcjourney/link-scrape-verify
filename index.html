<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>LinkedIn Profile Finder</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{
      background:#f5f7fa;color:#111827;
      font-family:'Segoe UI',system-ui,sans-serif;
      min-height:100vh;
    }
    .app{
      display:flex;flex-direction:column;align-items:center;
      padding:40px 16px 80px;
      min-height:100vh;
      width:100%;
    }
    h1{font-size:1.4rem;font-weight:700;color:#0a66c2;margin-bottom:24px}

    /* ── Search Form ── */
    .search-form{width:100%;max-width:820px;margin-bottom:14px}
    .field-group{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
    .field-row{display:flex;flex-direction:column;gap:4px}
    .field-label{font-size:.72rem;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.06em}
    .tag-input{
      display:flex;flex-wrap:wrap;gap:6px;align-items:center;
      background:#fff;border:1px solid #d1d5db;border-radius:8px;
      padding:7px 12px;cursor:text;min-height:42px;
      box-shadow:0 1px 3px rgba(0,0,0,.06);transition:border-color .2s;
    }
    .tag-input:focus-within{border-color:#0a66c2;box-shadow:0 0 0 3px rgba(10,102,194,.12)}
    .tag-input input{
      border:none;outline:none;background:transparent;
      font-size:.9rem;color:#111827;flex:1;min-width:100px;padding:2px 0;
    }
    .tag-input input::placeholder{color:#9ca3af}
    .chip{
      display:inline-flex;align-items:center;gap:4px;
      background:#e8f0fe;color:#0a66c2;border-radius:999px;
      padding:3px 10px 3px 12px;font-size:.78rem;font-weight:600;white-space:nowrap;
    }
    .chip-x{cursor:pointer;font-size:1rem;opacity:.5;line-height:1;padding-left:2px}
    .chip-x:hover{opacity:1}
    .combo-hint{font-size:.78rem;color:#9ca3af;margin-bottom:10px;min-height:18px}
    .combo-hint strong{color:#0a66c2}
    .search-bottom{display:flex;align-items:center;gap:12px}
    .btn{
      background:#0a66c2;color:#fff;border:none;border-radius:8px;
      padding:0 22px;height:42px;font-size:.9rem;font-weight:600;cursor:pointer;transition:background .15s;
      touch-action:manipulation;white-space:nowrap;
    }
    .btn:hover{background:#0856a8}
    .btn:disabled{opacity:.4;cursor:not-allowed}

    /* ── Status ── */
    #status{
      width:100%;max-width:820px;font-size:.82rem;color:#6b7280;
      margin-bottom:14px;min-height:18px;display:flex;align-items:center;gap:8px;
    }
    .spinner{width:13px;height:13px;border:2px solid #d1d5db;border-top-color:#0a66c2;
      border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ── Tabs ── */
    .tabs-row{
      display:flex;align-items:center;
      width:100%;max-width:820px;
      border-bottom:1px solid #e5e7eb;margin-bottom:20px;
    }
    .tab{
      padding:9px 20px;font-size:.85rem;font-weight:600;cursor:pointer;
      color:#9ca3af;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;
      margin-bottom:-1px;user-select:none;
    }
    .tab:hover{color:#6b7280}
    .tab.active{color:#0a66c2;border-bottom-color:#0a66c2}
    .tab-badge{
      display:inline-block;background:#e5e7eb;border-radius:999px;
      padding:1px 7px;font-size:.68rem;font-weight:700;margin-left:6px;color:#6b7280;
    }
    .tab.active .tab-badge{background:#0a66c2;color:#fff}
    .tabs-spacer{flex:1}
    .webhook-btn{
      background:#7c3aed;color:#fff;border:none;border-radius:7px;
      padding:7px 18px;font-size:.82rem;font-weight:600;cursor:pointer;
      transition:background .15s;white-space:nowrap;margin-left:12px;
      touch-action:manipulation;
    }
    .webhook-btn:hover{background:#6d28d9}
    .webhook-btn:disabled{opacity:.4;cursor:not-allowed}

    /* ── Tab panes ── */
    .pane{width:100%;max-width:820px;display:none}
    .pane.active{display:block}
    #pane-analysis{max-width:100%}

    /* ── URL list ── */
    .list-hdr{
      display:flex;align-items:center;gap:10px;
      margin-bottom:10px;flex-wrap:wrap;
    }
    .list-hdr-left{display:flex;align-items:center;gap:8px;flex:1}
    .list-hdr-left input[type=checkbox]{width:15px;height:15px;cursor:pointer;accent-color:#0a66c2;flex-shrink:0}
    .list-hdr span{font-size:.8rem;color:#9ca3af}
    .copy-all{background:#fff;border:1px solid #d1d5db;color:#6b7280;
      border-radius:6px;padding:4px 12px;font-size:.76rem;cursor:pointer;
      transition:border-color .15s,color .15s;}
    .copy-all:hover{border-color:#16a34a;color:#16a34a}
    .row{
      display:flex;align-items:center;gap:10px;
      background:#fff;border:1px solid #e5e7eb;border-radius:8px;
      padding:11px 14px;margin-bottom:8px;transition:border-color .15s;
      box-shadow:0 1px 2px rgba(0,0,0,.04);
    }
    .row:hover{border-color:#0a66c2}
    .row.selected{border-color:#0a66c2;background:#f0f7ff}
    .row-chkbox{width:15px;height:15px;cursor:pointer;accent-color:#0a66c2;flex-shrink:0}
    .row-num{color:#d1d5db;font-size:.75rem;min-width:22px;text-align:right;flex-shrink:0}
    .row-url{
      flex:1;color:#0a66c2;text-decoration:none;font-size:.83rem;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .row-url:hover{text-decoration:underline}
    .copy-btn{
      background:#fff;border:1px solid #e5e7eb;color:#9ca3af;
      border-radius:5px;padding:3px 10px;font-size:.73rem;cursor:pointer;
      transition:border-color .15s,color .15s;white-space:nowrap;flex-shrink:0;
    }
    .copy-btn:hover{border-color:#0a66c2;color:#0a66c2}
    .copy-btn.ok{border-color:#16a34a;color:#16a34a}

    /* ── Empty state ── */
    .empty-state{text-align:center;padding:60px 20px;color:#d1d5db;font-size:.88rem}
    .empty-state svg{margin-bottom:14px;opacity:.4}

    /* ── Sheet toolbar ── */
    .sheet-toolbar{
      display:flex;align-items:center;gap:10px;
      margin-bottom:10px;
    }
    .sheet-toolbar span{font-size:.8rem;color:#9ca3af}
    .copy-sel-btn{
      background:#0a66c2;color:#fff;border:none;border-radius:6px;
      padding:6px 16px;font-size:.8rem;font-weight:600;cursor:pointer;
      transition:background .15s;
    }
    .copy-sel-btn:hover{background:#0856a8}
    .copy-sel-btn:disabled{opacity:.35;cursor:not-allowed}
    .copy-sel-btn.ok{background:#16a34a}

    /* ══════════════════════════════════════════
       Sheet / Table
    ══════════════════════════════════════════ */
    .sheet-wrap{
      width:100%;overflow-x:auto;
      border:1px solid #e5e7eb;border-radius:10px;
      box-shadow:0 1px 6px rgba(0,0,0,.07);
      background:#fff;
    }
    .sheet-table{
      border-collapse:collapse;
      font-size:.8rem;
      min-width:100%;
    }
    .sheet-table thead tr{
      background:#f9fafb;
      border-bottom:2px solid #e5e7eb;
    }
    .sheet-table th{
      padding:10px 14px;
      text-align:left;
      font-size:.68rem;font-weight:700;
      text-transform:uppercase;letter-spacing:.07em;
      color:#6b7280;white-space:nowrap;
      border-right:1px solid #e5e7eb;
      position:sticky;top:0;background:#f9fafb;
    }
    .sheet-table th:last-child{border-right:none}
    .sheet-table tbody tr{border-bottom:1px solid #f3f4f6}
    .sheet-table tbody tr:last-child{border-bottom:none}
    .sheet-table tbody tr:hover td{background:#fafbff}
    .sheet-table td{
      padding:10px 14px;
      vertical-align:top;
      border-right:1px solid #f3f4f6;
      color:#374151;
    }
    .sheet-table td:last-child{border-right:none}
    .col-chk{width:36px;min-width:36px;text-align:center;padding:10px 6px}
    .col-chk input[type=checkbox]{width:15px;height:15px;cursor:pointer;accent-color:#0a66c2}
    .col-num{width:36px;min-width:36px;text-align:center;color:#d1d5db;font-size:.75rem;font-weight:600}
    .col-url{min-width:200px;max-width:240px}
    .col-url a{
      color:#0a66c2;text-decoration:none;font-size:.78rem;
      display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .col-url a:hover{text-decoration:underline}
    .cell-badge{
      display:inline-block;border:1px solid;border-radius:999px;
      padding:3px 11px;font-size:.72rem;font-weight:700;white-space:nowrap;
    }
    .cell-text{font-size:.78rem;color:#4b5563;line-height:1.55;white-space:normal;min-width:180px;max-width:320px}
    .cell-bullets{
      list-style:none;padding:0;margin:0;
      display:flex;flex-direction:column;gap:4px;
      min-width:200px;max-width:320px;
    }
    .cell-bullets li{
      font-size:.77rem;color:#4b5563;
      padding-left:13px;position:relative;line-height:1.45;white-space:normal;
    }
    .cell-bullets li::before{content:'•';position:absolute;left:0;color:#d1d5db}
    .cell-empty{color:#e5e7eb;font-size:.8rem}

    /* ── Page Tabs (LinkedIn / ICP) ── */
    .page-tabs{
      display:flex;gap:0;width:100%;max-width:820px;
      border-bottom:2px solid #e5e7eb;margin-bottom:24px;
    }
    .page-tab{
      padding:10px 28px;font-size:.92rem;font-weight:700;cursor:pointer;
      color:#9ca3af;border-bottom:3px solid transparent;margin-bottom:-2px;
      transition:color .15s,border-color .15s;user-select:none;
    }
    .page-tab:hover{color:#374151}
    .page-tab.active{color:#0a66c2;border-bottom-color:#0a66c2}
    .page-section{width:100%;display:none;flex-direction:column;align-items:center}
    .page-section.active{display:flex}

    /* ── ICP Search ── */
    .icp-form{width:100%;max-width:820px;margin-bottom:14px}
    .icp-search-row{display:flex;gap:10px;margin-bottom:14px}
    .icp-search-row input{
      flex:1;background:#fff;border:1px solid #d1d5db;border-radius:8px;
      color:#111827;font-size:.95rem;padding:12px 16px;outline:none;
      box-shadow:0 1px 3px rgba(0,0,0,.06);transition:border-color .2s;
    }
    .icp-search-row input:focus{border-color:#0a66c2;box-shadow:0 0 0 3px rgba(10,102,194,.12)}
    .icp-search-row input::placeholder{color:#9ca3af}
    .icp-hint{font-size:.78rem;color:#9ca3af;margin-bottom:4px}

    /* ── ICP Toolbar ── */
    .icp-toolbar{
      display:flex;align-items:center;gap:10px;
      width:100%;max-width:820px;margin-bottom:10px;flex-wrap:wrap;
    }
    .icp-toolbar-left{display:flex;align-items:center;gap:8px;flex:1}
    .icp-toolbar-left input[type=checkbox]{width:15px;height:15px;cursor:pointer;accent-color:#0a66c2;flex-shrink:0}
    .icp-toolbar span{font-size:.8rem;color:#9ca3af}
    .icp-export-btn{
      background:#16a34a;color:#fff;border:none;border-radius:6px;
      padding:4px 14px;font-size:.76rem;font-weight:600;cursor:pointer;
      transition:background .15s;white-space:nowrap;
    }
    .icp-export-btn:hover{background:#15803d}
    .icp-export-btn:disabled{opacity:.4;cursor:not-allowed}

    /* ── ICP Results ── */
    .icp-results{width:100%;max-width:820px}
    .icp-card{
      background:#fff;border:1px solid #e5e7eb;border-radius:8px;
      padding:14px 16px;margin-bottom:10px;
      box-shadow:0 1px 2px rgba(0,0,0,.04);transition:border-color .15s;
    }
    .icp-card:hover{border-color:#0a66c2}
    .icp-card.selected{border-color:#0a66c2;background:#f0f7ff}
    .icp-card-top{display:flex;align-items:flex-start;gap:10px}
    .icp-chk{width:15px;height:15px;cursor:pointer;accent-color:#0a66c2;flex-shrink:0;margin-top:2px}
    .icp-num{color:#d1d5db;font-size:.75rem;min-width:22px;text-align:right;flex-shrink:0;padding-top:2px}
    .icp-card-body{flex:1;min-width:0}
    .icp-title{font-size:.88rem;font-weight:700;color:#111827;margin-bottom:3px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .icp-url{font-size:.78rem;color:#0a66c2;text-decoration:none;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;margin-bottom:5px}
    .icp-url:hover{text-decoration:underline}
    .icp-desc{font-size:.78rem;color:#6b7280;line-height:1.5;
      display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .icp-copy{
      background:#fff;border:1px solid #e5e7eb;color:#9ca3af;
      border-radius:5px;padding:3px 10px;font-size:.73rem;cursor:pointer;
      transition:border-color .15s,color .15s;white-space:nowrap;flex-shrink:0;
    }
    .icp-copy:hover{border-color:#0a66c2;color:#0a66c2}
    .icp-copy.ok{border-color:#16a34a;color:#16a34a}

    /* ══════════════════════════════════════════
       Mobile
    ══════════════════════════════════════════ */
    .app.mob{padding:20px 12px 60px}
    .app.mob h1{font-size:1.1rem;margin-bottom:16px}
    .app.mob .btn{width:100%;border-radius:8px;font-size:.95rem}
    .app.mob #status{font-size:.78rem}
    .app.mob .tabs-row{flex-wrap:wrap;padding-bottom:8px;row-gap:8px}
    .app.mob .tabs-spacer{display:none}
    .app.mob .tab{padding:8px 14px;font-size:.8rem}
    .app.mob .webhook-btn{order:99;width:100%;margin-left:0;border-radius:8px;padding:11px 16px;font-size:.88rem}
    .app.mob .pane{max-width:100%}
    .app.mob .row{padding:10px;gap:8px}
    .app.mob .row-num{display:none}
    .app.mob .row-url{font-size:.8rem}
    .app.mob .copy-btn{padding:4px 8px;font-size:.7rem}
    .app.mob .list-hdr{gap:8px}
    .app.mob .copy-all{padding:5px 10px;font-size:.74rem}
    .app.mob .sheet-wrap{-webkit-overflow-scrolling:touch;border-radius:8px}
    .app.mob .sheet-toolbar{flex-wrap:wrap;gap:8px}
    .app.mob .copy-sel-btn{width:100%;text-align:center}
    .app.mob .search-bottom{flex-direction:column;align-items:stretch}
  </style>
</head>
<body>
<div class="app">

<h1>Lead Finder</h1>

<!-- Page-level tabs -->
<div class="page-tabs">
  <div class="page-tab active" id="ptab-linkedin" onclick="switchPage('linkedin')">LinkedIn</div>
  <div class="page-tab"        id="ptab-icp"      onclick="switchPage('icp')">ICP Finder</div>
</div>

<!-- ══ LinkedIn Section ══ -->
<div class="page-section active" id="page-linkedin">

<div class="search-form">
  <div class="field-group">
    <div class="field-row">
      <div class="field-label">Designation</div>
      <div class="tag-input" id="ti-desig" onclick="document.getElementById('inp-desig').focus()">
        <div id="tags-desig"></div>
        <input id="inp-desig" type="text" placeholder="e.g. Procurement Manager  (Enter to add)">
      </div>
    </div>
    <div class="field-row">
      <div class="field-label">Company</div>
      <div class="tag-input" id="ti-company" onclick="document.getElementById('inp-company').focus()">
        <div id="tags-company"></div>
        <input id="inp-company" type="text" placeholder="e.g. Tata AutoComp  (Enter to add)">
      </div>
    </div>
    <div class="field-row">
      <div class="field-label">Location</div>
      <div class="tag-input" id="ti-location" onclick="document.getElementById('inp-location').focus()">
        <div id="tags-location"></div>
        <input id="inp-location" type="text" placeholder="e.g. Mumbai  (Enter to add)">
      </div>
    </div>
  </div>
  <div class="combo-hint" id="comboHint"></div>
  <div class="search-bottom">
    <button class="btn" id="btn" onclick="doSearch()">Search</button>
  </div>
</div>

<div id="status"></div>

<!-- Tabs -->
<div class="tabs-row" id="tabsRow" style="display:none">
  <div class="tab active" id="tab-profiles" onclick="switchTab('profiles')">
    Profiles <span class="tab-badge" id="badge-profiles">0</span>
  </div>
  <div class="tab" id="tab-analysis" onclick="switchTab('analysis')">
    Analysis <span class="tab-badge" id="badge-analysis">–</span>
  </div>
  <div class="tabs-spacer"></div>
  <button class="webhook-btn" id="webhookBtn" onclick="sendWebhook()">Analyze</button>
</div>

<!-- Profiles pane -->
<div class="pane active" id="pane-profiles">
  <div class="list-hdr" id="listHdr" style="display:none">
    <div class="list-hdr-left">
      <input type="checkbox" id="chkAllProfiles" title="Select all" onchange="toggleAllProfiles(this)">
      <span id="listCount"></span>
    </div>
    <button class="copy-all" onclick="copyAll()">Copy All URLs</button>
  </div>
  <div id="list"></div>
</div>

<!-- Analysis pane -->
<div class="pane" id="pane-analysis">
  <div class="empty-state" id="analysisEmpty">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#0a66c2" stroke-width="1.5">
      <path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
    </svg>
    <div>Click <strong style="color:#7c3aed">Verify</strong> to analyse profiles</div>
  </div>
  <div class="sheet-toolbar" id="sheetToolbar" style="display:none">
    <span id="selCount">0 selected</span>
    <button class="copy-sel-btn" id="copySelBtn" onclick="copySelected()" disabled>Copy URLs</button>
  </div>
  <div id="wh-table"></div>
</div>

<script>
let allUrls   = [];
let lastQueries = [];

// ── Responsive ───────────────────────────────────────────────────────────────
(function(){
  const app = document.querySelector('.app');
  const update = w => app.classList.toggle('mob', w <= 640);
  update(app.offsetWidth);
  new ResizeObserver(entries => update(entries[0].contentRect.width)).observe(app);
})();

// ── Tag input state ───────────────────────────────────────────────────────────
const tags = { desig: [], company: [], location: [] };

function addTag(field, value) {
  value = value.trim().replace(/,+$/, '');
  if (!value || tags[field].includes(value)) return;
  tags[field].push(value);
  renderTags(field);
  updateComboHint();
}

function removeTag(field, idx) {
  tags[field].splice(idx, 1);
  renderTags(field);
  updateComboHint();
}

function renderTags(field) {
  const container = document.getElementById('tags-' + field);
  container.innerHTML = tags[field].map((t, i) =>
    `<span class="chip">${esc(t)}<span class="chip-x" onclick="removeTag('${field}',${i})">&times;</span></span>`
  ).join('');
}

function setupTagInput(field) {
  const inp = document.getElementById('inp-' + field);
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ',') {
      e.preventDefault();
      addTag(field, inp.value);
      inp.value = '';
    } else if (e.key === 'Backspace' && !inp.value && tags[field].length) {
      removeTag(field, tags[field].length - 1);
    }
  });
  inp.addEventListener('blur', () => {
    if (inp.value.trim()) { addTag(field, inp.value); inp.value = ''; }
  });
  inp.addEventListener('paste', e => {
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text');
    text.split(/[,\n]+/).forEach(v => addTag(field, v));
  });
}

['desig','company','location'].forEach(setupTagInput);

function updateComboHint() {
  const d = tags.desig.length    || 1;
  const c = tags.company.length  || 1;
  const l = tags.location.length || 1;
  const total = d * c * l;
  const hint  = document.getElementById('comboHint');
  const hasAny = tags.desig.length || tags.company.length || tags.location.length;
  if (hasAny && total > 1) {
    hint.innerHTML = `Will run <strong>${total}</strong> search combination${total !== 1 ? 's' : ''}`;
  } else {
    hint.textContent = '';
  }
}

function buildQueries() {
  const desigs  = tags.desig.length    ? tags.desig    : [''];
  const comps   = tags.company.length  ? tags.company  : [''];
  const locs    = tags.location.length ? tags.location : [''];
  const result  = [];
  const seen    = new Set();
  for (const d of desigs)
    for (const c of comps)
      for (const l of locs) {
        const parts = [];
        if (d) parts.push(`"${d}"`);
        if (c) parts.push(`"${c}"`);
        if (l) parts.push(l);
        if (!parts.length) continue;
        const q = `site:linkedin.com/in/ ${parts.join(' ')}`;
        if (!seen.has(q)) {
          seen.add(q);
          result.push({ query: q, location: l, company: c });
        }
      }
  return result;
}

// ── Tab switching ─────────────────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t  => t.classList.remove('active'));
  document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-'  + name).classList.add('active');
  document.getElementById('pane-' + name).classList.add('active');
}

// ── Search ────────────────────────────────────────────────────────────────────
async function doSearch() {
  const combinations = buildQueries();
  if (!combinations.length) {
    setStatus('error', 'Add at least one Designation, Company, or Location.');
    return;
  }
  lastQueries = combinations.map(c => c.query);

  document.getElementById('btn').disabled = true;
  document.getElementById('list').innerHTML = '';
  document.getElementById('listHdr').style.display = 'none';
  document.getElementById('tabsRow').style.display = 'none';
  document.getElementById('wh-table').innerHTML = '';
  document.getElementById('analysisEmpty').style.display = 'block';
  document.getElementById('badge-analysis').textContent = '–';
  allUrls = [];
  switchTab('profiles');
  setStatus('loading', 'Connecting...');

  const sid = Math.random().toString(36).slice(2) + Date.now().toString(36);
  const logSource = new EventSource(`/search-log?sid=${sid}`);
  logSource.onmessage = e => {
    const d = JSON.parse(e.data);
    if (d.done) { logSource.close(); return; }
    if (d.msg)  setStatus('loading', d.msg);
  };
  logSource.onerror = () => logSource.close();

  try {
    const res  = await fetch('/search', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ combinations, sid })
    });
    const data = await res.json();
    logSource.close();
    if (!res.ok) throw new Error(data.error || 'Server error');
    allUrls = data.urls || [];
    if (!allUrls.length) {
      setStatus('error', 'No profiles found. Try different search terms.');
      document.getElementById('btn').disabled = false;
      return;
    }
    renderList(allUrls);
    document.getElementById('tabsRow').style.display = 'flex';
    document.getElementById('webhookBtn').disabled = true;
    document.getElementById('badge-profiles').textContent = allUrls.length;
    const combLabel = combinations.length > 1 ? ` across ${combinations.length} searches` : '';
    setStatus('ok', `Found ${allUrls.length} profile${allUrls.length !== 1 ? 's' : ''}${combLabel}. Select profiles to send to webhook.`);
  } catch(e) {
    logSource.close();
    setStatus('error', e.message);
  }
  document.getElementById('btn').disabled = false;
}

// ── Send to Webhook ───────────────────────────────────────────────────────────
async function sendWebhook() {
  const query        = lastQueries.join('; ');
  const btn          = document.getElementById('webhookBtn');
  const selectedUrls = [...document.querySelectorAll('.profile-chk:checked')].map(c => c.dataset.url);
  if (!selectedUrls.length) return;

  btn.disabled = true;
  btn.textContent = 'Sending...';
  setStatus('loading', `Sending ${selectedUrls.length} profile${selectedUrls.length !== 1 ? 's' : ''} to webhook...`);

  try {
    const res  = await fetch('/send-webhook', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ query, urls: selectedUrls })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Webhook error');

    const arr = Array.isArray(data.response) ? data.response : [data.response];
    document.getElementById('analysisEmpty').style.display = 'none';
    document.getElementById('wh-table').innerHTML = renderSheet(arr);
    document.getElementById('badge-analysis').textContent = arr.length;
    document.getElementById('sheetToolbar').style.display = 'flex';
    updateSelCount();
    setStatus('ok', `Webhook analysed ${arr.length} profile${arr.length !== 1 ? 's' : ''}.`);
    switchTab('analysis');
    btn.textContent = 'Send to Webhook';
  } catch(e) {
    setStatus('error', `Webhook failed: ${e.message}`);
    btn.textContent = 'Send to Webhook';
  }
  updateProfileSelCount();
}

// ── Parse text blob ───────────────────────────────────────────────────────────
function parseOutput(text) {
  text = text.replace(/\r\n/g, '\n')
             .replace(/[ \t]+$/gm, '')
             .replace(/\n-{3,}\n?/g, '\n\n');
  const TITLE_RE = /^([A-Z][^:,.\n]{0,60}):\s*(.*)$/;
  const sections = [];
  let curTitle = null, curLines = [];
  const flush = () => {
    if (curTitle === null) return;
    const body = curLines.join('\n').trim();
    if (body) sections.push([curTitle, body]);
    curTitle = null; curLines = [];
  };
  for (const raw of text.split('\n')) {
    const line = raw.trimEnd();
    if (/^[-=*]{3,}$/.test(line.trim())) continue;
    const isBullet = line.trimStart().startsWith('-') || line.trimStart().startsWith('*');
    const m = !isBullet ? TITLE_RE.exec(line) : null;
    if (m) { flush(); curTitle = m[1].trim(); if (m[2].trim()) curLines = [m[2].trim()]; }
    else if (curTitle !== null) { curLines.push(line); }
  }
  flush();
  return sections;
}

function scoreColor(val) {
  const v = (val || '').toLowerCase();
  if (v.includes('high')   || v.includes('strong'))   return '#16a34a';
  if (v.includes('medium') || v.includes('moderate')) return '#d97706';
  if (v.includes('low')    || v.includes('weak'))     return '#dc2626';
  return null;
}

const WIDE_COLS = /why\s*relevant|reasoning|rationale|recommendation|analysis|description/i;

function colStyle(name) {
  return WIDE_COLS.test(name)
    ? 'min-width:320px;max-width:520px;white-space:normal'
    : 'min-width:80px;max-width:160px;white-space:normal';
}

function renderCell(value, colName) {
  if (!value) return `<span class="cell-empty">—</span>`;
  const lines    = value.split('\n').map(l => l.trim()).filter(Boolean);
  const bullets  = lines.filter(l => l.startsWith('-'));
  const isSingle = lines.length === 1;
  const wordCount = lines[0] ? lines[0].split(/\s+/).length : 0;
  const isWide   = WIDE_COLS.test(colName || '');
  const c = scoreColor(value);
  if (isSingle && wordCount <= 5 && c)
    return `<span class="cell-badge" style="border-color:${c};color:${c};background:${c}18">${esc(value)}</span>`;
  if (isWide && bullets.length && bullets.length === lines.length)
    return `<ul class="cell-bullets">${bullets.map(b => `<li>${esc(b.slice(1).trim())}</li>`).join('')}</ul>`;
  return `<span class="cell-text">${esc(value)}</span>`;
}

function renderSheet(items) {
  const parsed = items.map(item => {
    const secs = item.output
      ? parseOutput(item.output)
      : Object.entries(item).filter(([k]) => k !== 'url')
               .map(([k, v]) => [k, typeof v === 'string' ? v : JSON.stringify(v, null, 2)]);
    return { url: item.url || '', map: Object.fromEntries(secs), order: secs.map(([k]) => k) };
  });
  const colSeen = new Set(), cols = [];
  for (const { order } of parsed)
    for (const k of order)
      if (!colSeen.has(k)) { colSeen.add(k); cols.push(k); }

  let html = `<div class="sheet-wrap"><table class="sheet-table" id="sheetTable"><thead><tr>
    <th class="col-chk"><input type="checkbox" id="chkAll" title="Select all" onchange="toggleAll(this)"></th>
    <th class="col-num">#</th>
    <th style="min-width:180px;max-width:220px">URL</th>
    ${cols.map(c => `<th style="${colStyle(c)}">${esc(c)}</th>`).join('')}
  </tr></thead><tbody>`;
  parsed.forEach(({ url, map }, i) => {
    html += `<tr>
      <td class="col-chk"><input type="checkbox" class="row-chk" data-url="${esc(url)}" onchange="updateSelCount()"></td>
      <td class="col-num">${i + 1}</td>
      <td class="col-url"><a href="${esc(url)}" target="_blank" rel="noopener" title="${esc(url)}">${esc(url)}</a></td>
      ${cols.map(c => `<td style="${colStyle(c)}">${renderCell(map[c] || '', c)}</td>`).join('')}
    </tr>`;
  });
  html += `</tbody></table></div>`;
  return html;
}

function toggleAll(masterChk) {
  document.querySelectorAll('.row-chk').forEach(c => c.checked = masterChk.checked);
  updateSelCount();
}

function updateSelCount() {
  const checked = [...document.querySelectorAll('.row-chk:checked')];
  const total   = document.querySelectorAll('.row-chk').length;
  const btn     = document.getElementById('copySelBtn');
  const lbl     = document.getElementById('selCount');
  if (lbl) lbl.textContent = checked.length ? `${checked.length} of ${total} selected` : `${total} rows`;
  if (btn) btn.disabled = checked.length === 0;
  const master = document.getElementById('chkAll');
  if (master) master.indeterminate = checked.length > 0 && checked.length < total;
  if (master && checked.length === total && total > 0) master.checked = true;
  if (master && checked.length === 0) master.checked = false;
}

function copySelected() {
  const urls = [...document.querySelectorAll('.row-chk:checked')].map(c => c.dataset.url);
  if (!urls.length) return;
  copyToClipboard(urls.join('\n')).then(() => {
    const btn = document.getElementById('copySelBtn');
    btn.textContent = 'Copied!'; btn.classList.add('ok');
    setTimeout(() => { btn.textContent = 'Copy Selected URLs'; btn.classList.remove('ok'); }, 1800);
  });
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function setStatus(type, msg) {
  const el = document.getElementById('status');
  if (type === 'loading') el.innerHTML = `<div class="spinner"></div><span>${msg}</span>`;
  else if (type === 'error') el.innerHTML = `<span style="color:#dc2626">${msg}</span>`;
  else el.innerHTML = `<span style="color:#16a34a">${msg}</span>`;
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function copyToClipboard(text) {
  if (navigator.clipboard && window.isSecureContext)
    return navigator.clipboard.writeText(text).catch(() => _execCopy(text));
  return _execCopy(text);
}
function _execCopy(text) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:absolute;left:-9999px;top:0;width:1px;height:1px';
    document.body.appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, 99999);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok ? Promise.resolve() : Promise.reject(new Error('execCommand failed'));
  } catch(e) { return Promise.reject(e); }
}
function copyOne(btn, url) {
  copyToClipboard(url)
    .then(() => {
      btn.textContent = 'Copied!'; btn.classList.add('ok');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('ok'); }, 1500);
    })
    .catch(() => { btn.textContent = 'Failed!'; setTimeout(() => { btn.textContent = 'Copy'; }, 1500); });
}
function copyAll() {
  copyToClipboard(allUrls.join('\n'))
    .then(() => {
      const b = document.querySelector('.copy-all');
      b.textContent = 'Copied!';
      setTimeout(() => b.textContent = 'Copy All URLs', 1500);
    })
    .catch(() => setStatus('error', 'Copy failed — try selecting text manually.'));
}

// ── Page switching ────────────────────────────────────────────────────────────
function switchPage(name) {
  document.querySelectorAll('.page-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
  document.getElementById('ptab-' + name).classList.add('active');
  document.getElementById('page-' + name).classList.add('active');
}

// ── ICP Tag inputs ────────────────────────────────────────────────────────────
const icpTags = { 'icp-product': [], 'icp-location': [], 'icp-type': [] };

function addIcpTag(field, value) {
  value = value.trim().replace(/,+$/, '');
  if (!value || icpTags[field].includes(value)) return;
  icpTags[field].push(value);
  renderIcpTags(field);
  updateIcpComboHint();
}
function removeIcpTag(field, idx) {
  icpTags[field].splice(idx, 1);
  renderIcpTags(field);
  updateIcpComboHint();
}
function renderIcpTags(field) {
  const container = document.getElementById('tags-' + field);
  container.innerHTML = icpTags[field].map((t, i) =>
    `<span class="chip">${esc(t)}<span class="chip-x" onclick="removeIcpTag('${field}',${i})">&times;</span></span>`
  ).join('');
}
function setupIcpTagInput(field) {
  const inp = document.getElementById('inp-' + field);
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ',') {
      e.preventDefault(); addIcpTag(field, inp.value); inp.value = '';
    } else if (e.key === 'Backspace' && !inp.value && icpTags[field].length) {
      removeIcpTag(field, icpTags[field].length - 1);
    }
  });
  inp.addEventListener('blur', () => {
    if (inp.value.trim()) { addIcpTag(field, inp.value); inp.value = ''; }
  });
  inp.addEventListener('paste', e => {
    e.preventDefault();
    (e.clipboardData || window.clipboardData).getData('text')
      .split(/[,\n]+/).forEach(v => addIcpTag(field, v));
  });
}
document.addEventListener('DOMContentLoaded', () => {
  ['icp-product','icp-location','icp-type'].forEach(setupIcpTagInput);
});

function updateIcpComboHint() {
  const p = icpTags['icp-product'].length  || 1;
  const l = icpTags['icp-location'].length || 1;
  const t = icpTags['icp-type'].length     || 1;
  const total = p * l * t;
  const hint  = document.getElementById('icpComboHint');
  const hasAny = p > 1 || l > 1 || t > 1 ||
    icpTags['icp-product'].length || icpTags['icp-location'].length || icpTags['icp-type'].length;
  hint.innerHTML = (hasAny && total > 1)
    ? `Will run <strong>${total}</strong> search combination${total !== 1 ? 's' : ''}`
    : '';
}

function buildIcpCombinations() {
  const products  = icpTags['icp-product'].length  ? icpTags['icp-product']  : [''];
  const locations = icpTags['icp-location'].length ? icpTags['icp-location'] : [''];
  const types     = icpTags['icp-type'].length     ? icpTags['icp-type']     : [''];
  const result = [], seen = new Set();
  for (const p of products)
    for (const l of locations)
      for (const t of types) {
        const parts = [];
        if (p) parts.push(`"${p}"`);
        if (t) parts.push(t);
        if (l) parts.push(l);
        const q = parts.join(' ').trim();
        if (q && !seen.has(q)) { seen.add(q); result.push({ query: q, location: l }); }
      }
  return result;
}

function setIcpStatus(type, msg) {
  const el = document.getElementById('icpStatus');
  if (type === 'loading') el.innerHTML = `<div class="spinner"></div><span>${msg}</span>`;
  else if (type === 'error') el.innerHTML = `<span style="color:#dc2626">${msg}</span>`;
  else el.innerHTML = `<span style="color:#16a34a">${msg}</span>`;
}

async function doIcpSearch() {
  const combinations = buildIcpCombinations();
  if (!combinations.length) {
    setIcpStatus('error', 'Add at least one Product, Location, or Company Type.');
    return;
  }
  const btn = document.getElementById('icpBtn');
  btn.disabled = true;
  document.getElementById('icpResults').innerHTML = '';
  document.getElementById('icpToolbar').style.display = 'none';
  setIcpStatus('loading', 'Connecting...');

  const sid = Math.random().toString(36).slice(2) + Date.now().toString(36);
  const logSource = new EventSource(`/search-log?sid=${sid}`);
  logSource.onmessage = e => {
    const d = JSON.parse(e.data);
    if (d.done) { logSource.close(); return; }
    if (d.msg)  setIcpStatus('loading', d.msg);
  };
  logSource.onerror = () => logSource.close();

  try {
    const res  = await fetch('/icp-search', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ combinations, sid })
    });
    const data = await res.json();
    logSource.close();
    if (!res.ok) throw new Error(data.error || 'Server error');
    if (!data.results || !data.results.length) {
      setIcpStatus('error', 'No companies found. Try different search terms.');
      btn.disabled = false;
      return;
    }
    renderIcpResults(data.results);
    const combLabel = combinations.length > 1 ? ` across ${combinations.length} searches` : '';
    setIcpStatus('ok', `Found ${data.count} company website${data.count !== 1 ? 's' : ''}${combLabel}.`);
  } catch(e) {
    logSource.close();
    setIcpStatus('error', e.message);
  }
  btn.disabled = false;
}

let icpData = [];

function renderIcpResults(results) {
  icpData = results;
  const toolbar = document.getElementById('icpToolbar');
  toolbar.style.display = results.length ? 'flex' : 'none';
  updateIcpSelCount();

  document.getElementById('icpResults').innerHTML = results.map((r, i) => `
    <div class="icp-card" id="icp-card-${i}">
      <div class="icp-card-top">
        <input type="checkbox" class="icp-chk" data-idx="${i}" onchange="onIcpChk(this)">
        <span class="icp-num">${i + 1}</span>
        <div class="icp-card-body">
          <div class="icp-title">${esc(r.title)}</div>
          <a class="icp-url" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url)}</a>
          ${r.description ? `<div class="icp-desc">${esc(r.description)}</div>` : ''}
        </div>
        <button class="icp-copy" onclick="copyIcp(this,'${esc(r.url)}')">Copy</button>
      </div>
    </div>`).join('');
}

function onIcpChk(chk) {
  const card = document.getElementById('icp-card-' + chk.dataset.idx);
  if (card) card.classList.toggle('selected', chk.checked);
  updateIcpSelCount();
}

function toggleAllIcp(master) {
  document.querySelectorAll('.icp-chk').forEach(c => {
    c.checked = master.checked;
    const card = document.getElementById('icp-card-' + c.dataset.idx);
    if (card) card.classList.toggle('selected', master.checked);
  });
  updateIcpSelCount();
}

function updateIcpSelCount() {
  const all     = [...document.querySelectorAll('.icp-chk')];
  const checked = all.filter(c => c.checked);
  const master  = document.getElementById('icpChkAll');
  const lbl     = document.getElementById('icpSelCount');
  if (lbl) lbl.textContent = checked.length
    ? `${checked.length} of ${all.length} selected`
    : `${all.length} compan${all.length !== 1 ? 'ies' : 'y'}`;
  if (master) {
    master.indeterminate = checked.length > 0 && checked.length < all.length;
    master.checked = all.length > 0 && checked.length === all.length;
  }
}

function exportIcpCsv() {
  const checked = [...document.querySelectorAll('.icp-chk:checked')];
  const rows    = checked.length
    ? checked.map(c => icpData[parseInt(c.dataset.idx)])
    : icpData;
  if (!rows.length) return;
  const q = v => `"${String(v).replace(/"/g, '""')}"`;
  const csv = ['Company,URL,Description']
    .concat(rows.map(r => `${q(r.title)},${q(r.url)},${q(r.description)}`))
    .join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'icp_companies.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

function copyAllIcpUrls() {
  const checked = [...document.querySelectorAll('.icp-chk:checked')];
  const urls    = checked.length
    ? checked.map(c => icpData[parseInt(c.dataset.idx)].url)
    : icpData.map(r => r.url);
  copyToClipboard(urls.join('\n')).then(() => {
    const b = document.querySelector('.icp-toolbar .copy-all');
    b.textContent = 'Copied!';
    setTimeout(() => b.textContent = 'Copy All URLs', 1500);
  });
}

function copyIcp(btn, url) {
  copyToClipboard(url)
    .then(() => {
      btn.textContent = 'Copied!'; btn.classList.add('ok');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('ok'); }, 1500);
    })
    .catch(() => { btn.textContent = 'Failed!'; setTimeout(() => { btn.textContent = 'Copy'; }, 1500); });
}

      <span id="icpSelCount"></span>
    </div>
    <button class="copy-all" onclick="copyAllIcpUrls()">Copy All URLs</button>
    <button class="icp-export-btn" id="icpExportBtn" onclick="exportIcpCsv()">Export CSV</button>
  </div>
  <div class="icp-results" id="icpResults"></div>
</div><!-- /#page-icp -->

</div><!-- /.app -->
</body>
</html>
