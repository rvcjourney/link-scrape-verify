<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>LinkedIn Profile Finder</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{
      background:#f5f7fa;color:#111827;
      font-family:'Segoe UI',system-ui,sans-serif;
      min-height:100vh;display:flex;flex-direction:column;
      align-items:center;padding:40px 16px 80px;
    }
    h1{font-size:1.4rem;font-weight:700;color:#0a66c2;margin-bottom:24px}

    /* ── Search ── */
    .search-row{display:flex;gap:10px;width:100%;max-width:820px;margin-bottom:14px}
    input[type=text]{
      flex:1;background:#fff;border:1px solid #d1d5db;border-radius:8px;
      color:#111827;font-size:.95rem;padding:12px 16px;outline:none;transition:border-color .2s;
      box-shadow:0 1px 3px rgba(0,0,0,.06);
    }
    input[type=text]:focus{border-color:#0a66c2;box-shadow:0 0 0 3px rgba(10,102,194,.12)}
    input[type=text]::placeholder{color:#9ca3af}
    .btn{
      background:#0a66c2;color:#fff;border:none;border-radius:8px;
      padding:0 22px;font-size:.9rem;font-weight:600;cursor:pointer;transition:background .15s;
    }
    .btn:hover{background:#0856a8}
    .btn:disabled{opacity:.4;cursor:not-allowed}

    /* ── Status ── */
    #status{
      width:100%;max-width:820px;font-size:.82rem;color:#6b7280;
      margin-bottom:14px;min-height:18px;display:flex;align-items:center;gap:8px;
    }
    .spinner{width:13px;height:13px;border:2px solid #d1d5db;border-top-color:#0a66c2;
      border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ── Tabs ── */
    .tabs-row{
      display:flex;align-items:center;
      width:100%;max-width:820px;
      border-bottom:1px solid #e5e7eb;margin-bottom:20px;
    }
    .tab{
      padding:9px 20px;font-size:.85rem;font-weight:600;cursor:pointer;
      color:#9ca3af;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;
      margin-bottom:-1px;user-select:none;
    }
    .tab:hover{color:#6b7280}
    .tab.active{color:#0a66c2;border-bottom-color:#0a66c2}
    .tab-badge{
      display:inline-block;background:#e5e7eb;border-radius:999px;
      padding:1px 7px;font-size:.68rem;font-weight:700;margin-left:6px;color:#6b7280;
    }
    .tab.active .tab-badge{background:#0a66c2;color:#fff}
    .tabs-spacer{flex:1}
    .webhook-btn{
      background:#7c3aed;color:#fff;border:none;border-radius:7px;
      padding:7px 18px;font-size:.82rem;font-weight:600;cursor:pointer;
      transition:background .15s;white-space:nowrap;margin-left:12px;
    }
    .webhook-btn:hover{background:#6d28d9}
    .webhook-btn:disabled{opacity:.4;cursor:not-allowed}

    /* ── Tab panes ── */
    .pane{width:100%;max-width:820px;display:none}
    .pane.active{display:block}
    #pane-analysis{max-width:100%}

    /* ── URL list ── */
    .list-hdr{
      display:flex;align-items:center;gap:10px;
      margin-bottom:10px;flex-wrap:wrap;
    }
    .list-hdr-left{display:flex;align-items:center;gap:8px;flex:1}
    .list-hdr-left input[type=checkbox]{width:15px;height:15px;cursor:pointer;accent-color:#0a66c2;flex-shrink:0}
    .list-hdr span{font-size:.8rem;color:#9ca3af}
    .copy-all{background:#fff;border:1px solid #d1d5db;color:#6b7280;
      border-radius:6px;padding:4px 12px;font-size:.76rem;cursor:pointer;
      transition:border-color .15s,color .15s;}
    .copy-all:hover{border-color:#16a34a;color:#16a34a}
    .row{
      display:flex;align-items:center;gap:10px;
      background:#fff;border:1px solid #e5e7eb;border-radius:8px;
      padding:11px 14px;margin-bottom:8px;transition:border-color .15s;
      box-shadow:0 1px 2px rgba(0,0,0,.04);
    }
    .row:hover{border-color:#0a66c2}
    .row.selected{border-color:#0a66c2;background:#f0f7ff}
    .row-chkbox{width:15px;height:15px;cursor:pointer;accent-color:#0a66c2;flex-shrink:0}
    .row-num{color:#d1d5db;font-size:.75rem;min-width:22px;text-align:right;flex-shrink:0}
    .row-url{
      flex:1;color:#0a66c2;text-decoration:none;font-size:.83rem;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .row-url:hover{text-decoration:underline}
    .copy-btn{
      background:#fff;border:1px solid #e5e7eb;color:#9ca3af;
      border-radius:5px;padding:3px 10px;font-size:.73rem;cursor:pointer;
      transition:border-color .15s,color .15s;white-space:nowrap;flex-shrink:0;
    }
    .copy-btn:hover{border-color:#0a66c2;color:#0a66c2}
    .copy-btn.ok{border-color:#16a34a;color:#16a34a}

    /* ── Empty state ── */
    .empty-state{text-align:center;padding:60px 20px;color:#d1d5db;font-size:.88rem}
    .empty-state svg{margin-bottom:14px;opacity:.4}

    /* ── Sheet toolbar ── */
    .sheet-toolbar{
      display:flex;align-items:center;gap:10px;
      margin-bottom:10px;
    }
    .sheet-toolbar span{font-size:.8rem;color:#9ca3af}
    .copy-sel-btn{
      background:#0a66c2;color:#fff;border:none;border-radius:6px;
      padding:6px 16px;font-size:.8rem;font-weight:600;cursor:pointer;
      transition:background .15s;
    }
    .copy-sel-btn:hover{background:#0856a8}
    .copy-sel-btn:disabled{opacity:.35;cursor:not-allowed}
    .copy-sel-btn.ok{background:#16a34a}

    /* ══════════════════════════════════════════
       Sheet / Table
    ══════════════════════════════════════════ */
    .sheet-wrap{
      width:100%;overflow-x:auto;
      border:1px solid #e5e7eb;border-radius:10px;
      box-shadow:0 1px 6px rgba(0,0,0,.07);
      background:#fff;
    }
    .sheet-table{
      border-collapse:collapse;
      font-size:.8rem;
      min-width:100%;
    }
    .sheet-table thead tr{
      background:#f9fafb;
      border-bottom:2px solid #e5e7eb;
    }
    .sheet-table th{
      padding:10px 14px;
      text-align:left;
      font-size:.68rem;font-weight:700;
      text-transform:uppercase;letter-spacing:.07em;
      color:#6b7280;white-space:nowrap;
      border-right:1px solid #e5e7eb;
      position:sticky;top:0;background:#f9fafb;
    }
    .sheet-table th:last-child{border-right:none}

    .sheet-table tbody tr{border-bottom:1px solid #f3f4f6}
    .sheet-table tbody tr:last-child{border-bottom:none}
    .sheet-table tbody tr:hover td{background:#fafbff}
    .sheet-table td{
      padding:10px 14px;
      vertical-align:top;
      border-right:1px solid #f3f4f6;
      color:#374151;
    }
    .sheet-table td:last-child{border-right:none}

    /* fixed columns */
    .col-chk{width:36px;min-width:36px;text-align:center;padding:10px 6px}
    .col-chk input[type=checkbox]{width:15px;height:15px;cursor:pointer;accent-color:#0a66c2}
    .col-num{
      width:36px;min-width:36px;text-align:center;
      color:#d1d5db;font-size:.75rem;font-weight:600;
    }
    .col-url{
      min-width:200px;max-width:240px;
    }
    .col-url a{
      color:#0a66c2;text-decoration:none;font-size:.78rem;
      display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .col-url a:hover{text-decoration:underline}

    /* cell content types */
    .cell-badge{
      display:inline-block;border:1px solid;border-radius:999px;
      padding:3px 11px;font-size:.72rem;font-weight:700;white-space:nowrap;
    }
    .cell-text{
      font-size:.78rem;color:#4b5563;line-height:1.55;
      white-space:normal;min-width:180px;max-width:320px;
    }
    .cell-bullets{
      list-style:none;padding:0;margin:0;
      display:flex;flex-direction:column;gap:4px;
      min-width:200px;max-width:320px;
    }
    .cell-bullets li{
      font-size:.77rem;color:#4b5563;
      padding-left:13px;position:relative;line-height:1.45;
      white-space:normal;
    }
    .cell-bullets li::before{content:'•';position:absolute;left:0;color:#d1d5db}
    .cell-empty{color:#e5e7eb;font-size:.8rem}
  </style>
</head>
<body>

<h1>LinkedIn Profile Finder</h1>

<div class="search-row">
  <input id="q" type="text"
    placeholder="e.g. Procurement manager Tata AutoComp Pune"
    value=""/>
  <button class="btn" id="btn" onclick="doSearch()">Search</button>
</div>

<div id="status"></div>

<!-- Tabs -->
<div class="tabs-row" id="tabsRow" style="display:none">
  <div class="tab active" id="tab-profiles" onclick="switchTab('profiles')">
    Profiles <span class="tab-badge" id="badge-profiles">0</span>
  </div>
  <div class="tab" id="tab-analysis" onclick="switchTab('analysis')">
    Analysis <span class="tab-badge" id="badge-analysis">–</span>
  </div>
  <div class="tabs-spacer"></div>
  <button class="webhook-btn" id="webhookBtn" onclick="sendWebhook()">Send to Webhook</button>
</div>

<!-- Profiles pane -->
<div class="pane active" id="pane-profiles">
  <div class="list-hdr" id="listHdr" style="display:none">
    <div class="list-hdr-left">
      <input type="checkbox" id="chkAllProfiles" title="Select all" onchange="toggleAllProfiles(this)">
      <span id="listCount"></span>
    </div>
    <button class="copy-all" onclick="copyAll()">Copy All URLs</button>
  </div>
  <div id="list"></div>
</div>

<!-- Analysis pane -->
<div class="pane" id="pane-analysis">
  <div class="empty-state" id="analysisEmpty">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#0a66c2" stroke-width="1.5">
      <path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
    </svg>
    <div>Click <strong style="color:#7c3aed">Verify</strong> to analyse profiles</div>
  </div>
  <div class="sheet-toolbar" id="sheetToolbar" style="display:none">
    <span id="selCount">0 selected</span>
    <button class="copy-sel-btn" id="copySelBtn" onclick="copySelected()" disabled>Copy URLs</button>
  </div>
  <div id="wh-table"></div>
</div>

<script>
let allUrls = [];

document.getElementById('q').addEventListener('keydown', e => { if(e.key==='Enter') doSearch(); });

// ── Tab switching ────────────────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t  => t.classList.remove('active'));
  document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-'  + name).classList.add('active');
  document.getElementById('pane-' + name).classList.add('active');
}

// ── Search ───────────────────────────────────────────────────────────────────
async function doSearch() {
  const query = document.getElementById('q').value.trim();
  if (!query) return;
  document.getElementById('btn').disabled = true;
  document.getElementById('list').innerHTML = '';
  document.getElementById('listHdr').style.display = 'none';
  document.getElementById('tabsRow').style.display = 'none';
  document.getElementById('wh-table').innerHTML = '';
  document.getElementById('analysisEmpty').style.display = 'block';
  document.getElementById('badge-analysis').textContent = '–';
  allUrls = [];
  switchTab('profiles');
  setStatus('loading', 'Connecting...');

  const sid = Math.random().toString(36).slice(2) + Date.now().toString(36);
  const logSource = new EventSource(`/search-log?sid=${sid}`);
  logSource.onmessage = (e) => {
    const d = JSON.parse(e.data);
    if (d.done) { logSource.close(); return; }
    if (d.msg)  setStatus('loading', d.msg);
  };
  logSource.onerror = () => logSource.close();

  try {
    const res  = await fetch('/search', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({query, sid})});
    const data = await res.json();
    logSource.close();
    if (!res.ok) throw new Error(data.error || 'Server error');
    allUrls = data.urls || [];
    if (!allUrls.length) {
      setStatus('error', 'No profiles found. Try a different query.');
      document.getElementById('btn').disabled = false;
      return;
    }
    renderList(allUrls);
    document.getElementById('tabsRow').style.display = 'flex';
    document.getElementById('webhookBtn').disabled = true;
    document.getElementById('badge-profiles').textContent = allUrls.length;
    setStatus('ok', `Found ${allUrls.length} profile${allUrls.length !== 1 ? 's' : ''}. Select profiles to send to webhook.`);
  } catch(e) {
    logSource.close();
    setStatus('error', e.message);
  }
  document.getElementById('btn').disabled = false;
}

// ── Render URL list ──────────────────────────────────────────────────────────
function renderList(urls) {
  document.getElementById('list').innerHTML = urls.map((url, i) => `
    <div class="row" id="prow-${i}">
      <input class="row-chkbox profile-chk" type="checkbox" data-url="${url}" data-idx="${i}"
        onchange="onProfileChk(this)">
      <span class="row-num">${i + 1}</span>
      <a class="row-url" href="${url}" target="_blank" rel="noopener">${url}</a>
      <button class="copy-btn" onclick="copyOne(this,'${url}')">Copy</button>
    </div>`).join('');
  document.getElementById('listHdr').style.display = 'flex';
  updateProfileSelCount();
}

function onProfileChk(chk) {
  const row = document.getElementById('prow-' + chk.dataset.idx);
  if (row) row.classList.toggle('selected', chk.checked);
  updateProfileSelCount();
}

function toggleAllProfiles(master) {
  document.querySelectorAll('.profile-chk').forEach(c => {
    c.checked = master.checked;
    const row = document.getElementById('prow-' + c.dataset.idx);
    if (row) row.classList.toggle('selected', master.checked);
  });
  updateProfileSelCount();
}

function updateProfileSelCount() {
  const all     = [...document.querySelectorAll('.profile-chk')];
  const checked = all.filter(c => c.checked);
  const master  = document.getElementById('chkAllProfiles');
  const lbl     = document.getElementById('listCount');
  const whBtn   = document.getElementById('webhookBtn');

  if (lbl) lbl.textContent = checked.length
    ? `${checked.length} of ${all.length} selected`
    : `${all.length} profile${all.length !== 1 ? 's' : ''}`;

  if (master) {
    master.indeterminate = checked.length > 0 && checked.length < all.length;
    master.checked = all.length > 0 && checked.length === all.length;
  }
  if (whBtn) whBtn.disabled = checked.length === 0;
}

// ── Send to Webhook ──────────────────────────────────────────────────────────
async function sendWebhook() {
  const query       = document.getElementById('q').value.trim();
  const btn         = document.getElementById('webhookBtn');
  const selectedUrls = [...document.querySelectorAll('.profile-chk:checked')].map(c => c.dataset.url);
  if (!selectedUrls.length) return;

  btn.disabled = true;
  btn.textContent = 'Sending...';
  setStatus('loading', `Sending ${selectedUrls.length} profile${selectedUrls.length !== 1 ? 's' : ''} to webhook...`);

  try {
    const res  = await fetch('/send-webhook', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({query, urls: selectedUrls})});
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Webhook error');

    const arr = Array.isArray(data.response) ? data.response : [data.response];
    document.getElementById('analysisEmpty').style.display = 'none';
    document.getElementById('wh-table').innerHTML = renderSheet(arr);
    document.getElementById('badge-analysis').textContent = arr.length;
    document.getElementById('sheetToolbar').style.display = 'flex';
    updateSelCount();
    setStatus('ok', `Webhook analysed ${arr.length} profile${arr.length !== 1 ? 's' : ''}.`);
    switchTab('analysis');
    btn.textContent = 'Send to Webhook';
  } catch(e) {
    setStatus('error', `Webhook failed: ${e.message}`);
    btn.textContent = 'Send to Webhook';
  }
  updateProfileSelCount(); // re-enable based on current selection
}

// ── Parse text blob → ordered [ [title, value] ] pairs ──────────────────────
function parseOutput(text) {
  text = text.replace(/\r\n/g, '\n')
             .replace(/[ \t]+$/gm, '')
             .replace(/\n-{3,}\n?/g, '\n\n');

  const TITLE_RE = /^([A-Z][^:,.\n]{0,60}):\s*(.*)$/;
  const sections = [];
  let curTitle = null;
  let curLines = [];

  const flush = () => {
    if (curTitle === null) return;
    const body = curLines.join('\n').trim();
    if (body) sections.push([curTitle, body]);
    curTitle = null; curLines = [];
  };

  for (const raw of text.split('\n')) {
    const line = raw.trimEnd();
    if (/^[-=*]{3,}$/.test(line.trim())) continue;
    const isBullet = line.trimStart().startsWith('-') || line.trimStart().startsWith('*');
    const m = !isBullet ? TITLE_RE.exec(line) : null;
    if (m) {
      flush();
      curTitle = m[1].trim();
      if (m[2].trim()) curLines = [m[2].trim()];
    } else if (curTitle !== null) {
      curLines.push(line);
    }
  }
  flush();
  return sections;
}

// ── Score color ──────────────────────────────────────────────────────────────
function scoreColor(val) {
  const v = (val || '').toLowerCase();
  if (v.includes('high')   || v.includes('strong'))   return '#16a34a';
  if (v.includes('medium') || v.includes('moderate')) return '#d97706';
  if (v.includes('low')    || v.includes('weak'))     return '#dc2626';
  return null;
}

// ── Render a cell value ──────────────────────────────────────────────────────
function renderCell(value, colName) {
  if (!value) return `<span class="cell-empty">—</span>`;

  const lines    = value.split('\n').map(l => l.trim()).filter(Boolean);
  const bullets  = lines.filter(l => l.startsWith('-'));
  const isSingle = lines.length === 1;
  const wordCount = lines[0] ? lines[0].split(/\s+/).length : 0;
  const isWide   = WIDE_COLS.test(colName || '');

  // Score badge
  const c = scoreColor(value);
  if (isSingle && wordCount <= 5 && c)
    return `<span class="cell-badge" style="border-color:${c};color:${c};background:${c}18">${esc(value)}</span>`;

  // Bullet list (wide columns only — narrow cols show truncated text)
  if (isWide && bullets.length && bullets.length === lines.length)
    return `<ul class="cell-bullets">${
      bullets.map(b => `<li>${esc(b.slice(1).trim())}</li>`).join('')
    }</ul>`;

  // Plain text — all columns wrap
  return `<span class="cell-text">${esc(value)}</span>`;
}

// ── Column width policy ──────────────────────────────────────────────────────
const WIDE_COLS = /why\s*relevant|reasoning|rationale|recommendation|analysis|description/i;

function colStyle(name) {
  if (WIDE_COLS.test(name))
    return 'min-width:320px;max-width:520px;white-space:normal';
  return 'min-width:80px;max-width:160px;white-space:normal';
}

// ── Render full sheet table ──────────────────────────────────────────────────
function renderSheet(items) {
  // Parse all items
  const parsed = items.map(item => {
    const secs = item.output
      ? parseOutput(item.output)
      : Object.entries(item).filter(([k]) => k !== 'url')
               .map(([k, v]) => [k, typeof v === 'string' ? v : JSON.stringify(v, null, 2)]);
    return { url: item.url || '', map: Object.fromEntries(secs), order: secs.map(([k]) => k) };
  });

  // Collect columns in order of first appearance
  const colSeen = new Set();
  const cols = [];
  for (const { order } of parsed)
    for (const k of order)
      if (!colSeen.has(k)) { colSeen.add(k); cols.push(k); }

  // Table header
  let html = `<div class="sheet-wrap"><table class="sheet-table" id="sheetTable"><thead><tr>
    <th class="col-chk"><input type="checkbox" id="chkAll" title="Select all" onchange="toggleAll(this)"></th>
    <th class="col-num">#</th>
    <th style="min-width:180px;max-width:220px">URL</th>
    ${cols.map(c => `<th style="${colStyle(c)}">${esc(c)}</th>`).join('')}
  </tr></thead><tbody>`;

  // Rows
  parsed.forEach(({ url, map }, i) => {
    html += `<tr>
      <td class="col-chk"><input type="checkbox" class="row-chk" data-url="${esc(url)}" onchange="updateSelCount()"></td>
      <td class="col-num">${i + 1}</td>
      <td class="col-url"><a href="${esc(url)}" target="_blank" rel="noopener" title="${esc(url)}">${esc(url)}</a></td>
      ${cols.map(c => `<td style="${colStyle(c)}">${renderCell(map[c] || '', c)}</td>`).join('')}
    </tr>`;
  });

  html += `</tbody></table></div>`;
  return html;
}

// ── Checkbox / copy selection ────────────────────────────────────────────────
function toggleAll(masterChk) {
  document.querySelectorAll('.row-chk').forEach(c => c.checked = masterChk.checked);
  updateSelCount();
}

function updateSelCount() {
  const checked = [...document.querySelectorAll('.row-chk:checked')];
  const total   = document.querySelectorAll('.row-chk').length;
  const btn     = document.getElementById('copySelBtn');
  const lbl     = document.getElementById('selCount');
  if (lbl) lbl.textContent = checked.length ? `${checked.length} of ${total} selected` : `${total} rows`;
  if (btn) btn.disabled = checked.length === 0;
  const master = document.getElementById('chkAll');
  if (master) master.indeterminate = checked.length > 0 && checked.length < total;
  if (master && checked.length === total && total > 0) master.checked = true;
  if (master && checked.length === 0) master.checked = false;
}

function copySelected() {
  const urls = [...document.querySelectorAll('.row-chk:checked')].map(c => c.dataset.url);
  if (!urls.length) return;
  navigator.clipboard.writeText(urls.join('\n')).then(() => {
    const btn = document.getElementById('copySelBtn');
    btn.textContent = 'Copied!';
    btn.classList.add('ok');
    setTimeout(() => { btn.textContent = 'Copy Selected URLs'; btn.classList.remove('ok'); }, 1800);
  });
}

// ── Helpers ──────────────────────────────────────────────────────────────────
function setStatus(type, msg) {
  const el = document.getElementById('status');
  if (type === 'loading') el.innerHTML = `<div class="spinner"></div><span>${msg}</span>`;
  else if (type === 'error') el.innerHTML = `<span style="color:#dc2626">${msg}</span>`;
  else el.innerHTML = `<span style="color:#16a34a">${msg}</span>`;
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function copyOne(btn, url) {
  navigator.clipboard.writeText(url).then(() => {
    btn.textContent = 'Copied!'; btn.classList.add('ok');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('ok'); }, 1500);
  });
}
function copyAll() {
  navigator.clipboard.writeText(allUrls.join('\n')).then(() => {
    const b = document.querySelector('.copy-all');
    b.textContent = 'Copied!';
    setTimeout(() => b.textContent = 'Copy All URLs', 1500);
  });
}
</script>
</body>
